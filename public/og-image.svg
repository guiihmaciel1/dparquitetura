<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1C1917"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Accent line top -->
  <rect x="0" y="0" width="1200" height="4" fill="#C9A86C"/>
  
  <!-- Logo circle background -->
  <circle cx="600" cy="250" r="100" fill="#292524" stroke="#C9A86C" stroke-width="2"/>
  
  <!-- Logo text DP -->
  <text x="600" y="275" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="500" fill="#C9A86C">DP</text>
  
  <!-- Main title -->
  <text x="600" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="48" fill="#FFFFFF">Debora Pieri</text>
  
  <!-- Subtitle -->
  <text x="600" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" letter-spacing="8" fill="#C9A86C">ARQUITETURA</text>
  
  <!-- Tagline -->
  <text x="600" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.6)">Arquitetura que Conecta Forma, Função e Identidade</text>
  
  <!-- Location -->
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.4)">Mirassol • São José do Rio Preto • Região</text>
</svg>
